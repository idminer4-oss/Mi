
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin IDR MINIER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0c;
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
      }
      
      /* Loader Screen - Selalu di atas */
      #loader-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #0a0a0c;
        z-index: 99999;
        transition: all 0.6s ease-in-out;
      }

      /* Animasi Spinner Koin */
      .coin-spinner {
        width: 70px;
        height: 70px;
        position: relative;
        perspective: 1000px;
        margin-bottom: 20px;
      }

      .coin-inner {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        border-radius: 50%;
        box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: rotate-coin 2s linear infinite;
        border: 3px solid #854d0e;
      }

      .coin-inner::after {
        content: 'IDR';
        font-family: 'Orbitron', sans-serif;
        color: #422006;
        font-weight: 800;
        font-size: 12px;
      }

      @keyframes rotate-coin {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(360deg); }
      }

      .status-text {
        font-family: 'Orbitron', sans-serif;
        color: #eab308;
        font-size: 9px;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
        margin-top: 10px;
        min-height: 20px;
      }

      /* Progress Bar Kecil */
      .progress-container {
        width: 150px;
        height: 2px;
        background: rgba(255,255,255,0.05);
        margin-top: 15px;
        border-radius: 10px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: #eab308;
        box-shadow: 0 0 10px #eab308;
        transition: width 0.3s ease;
      }

      /* Root Container - Tampil Normal */
      #root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }
    </style>
    <script>
      window.process = { env: { API_KEY: "" } };
      
      // Fungsi global untuk dipanggil oleh React App.tsx saat sudah render
      window.markAppAsReady = function() {
        const loader = document.getElementById('loader-screen');
        const bar = document.getElementById('loading-progress');
        if (bar) bar.style.width = '100%';
        
        setTimeout(() => {
          if (loader) {
            loader.style.opacity = '0';
            loader.style.pointerEvents = 'none';
            setTimeout(() => loader.remove(), 600);
          }
        }, 300);
      };

      // Emergency auto-hide jika React gagal memanggil (safety)
      setTimeout(() => {
        const loader = document.getElementById('loader-screen');
        if (loader) {
          console.warn("Loader timed out. Forcing show.");
          window.markAppAsReady();
        }
      }, 8000);
    </script>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- Screen Loading -->
    <div id="loader-screen">
      <div class="coin-spinner">
        <div class="coin-inner"></div>
      </div>
      <div class="status-text" id="status-msg">BOOTING SYSTEM...</div>
      <div class="progress-container">
        <div class="progress-bar" id="loading-progress"></div>
      </div>
    </div>

    <!-- Aplikasi utama -->
    <div id="root"></div>

    <script type="module" src="./index.tsx"></script>
    
    <script>
      // Animasi teks status
      const msgs = ["Initializing Network", "Verifying Nodes", "Syncing Wallet", "Secure Ready"];
      let step = 0;
      const progress = document.getElementById('loading-progress');
      const interval = setInterval(() => {
        const el = document.getElementById('status-msg');
        if (el && step < msgs.length) {
          el.innerText = msgs[step];
          if (progress) progress.style.width = ((step + 1) * 20) + '%';
          step++;
        } else {
          clearInterval(interval);
        }
      }, 600);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
